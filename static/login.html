<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TAPP Base Plate — Login</title>
<style>
  body{font-family:-apple-system,system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#f4f5f7;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
  .box{background:#fff;border:1px solid #dde3ea;border-radius:12px;padding:28px;width:320px}
  h1{font-size:19px;margin:0 0 6px;color:#16324f} p{font-size:13px;color:#55677d}
  input{width:100%;padding:10px;border:1px solid #c7d0da;border-radius:6px;font-size:16px;box-sizing:border-box;margin:8px 0}
  button{width:100%;background:#16324f;color:#fff;border:0;border-radius:6px;padding:11px;font-size:16px;cursor:pointer}
  .err{color:#c0272d;font-size:13px;min-height:18px}
</style>
</head>
<body>
<div class="box">
  <h1>TAPP Base Plate</h1>
  <p>Enter the app password to continue.</p>
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
  <div class="err" id="err"></div>
  <button id="go">Enter</button>
</div>
<script>
async function login() {
  const pw = document.getElementById('pw').value;
  const r = await fetch('/api/login', {method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({password: pw})});
  const j = await r.json().catch(() => ({}));
  if (r.ok && j.ok) { location.href = '/'; return; }
  document.getElementById('err').textContent = j.error || 'Login failed';
}
document.getElementById('go').onclick = login;
document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
document.getElementById('pw').focus();
</script>
</body>
</html>
